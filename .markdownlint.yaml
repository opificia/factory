# markdownlint configuration for Opificia AI.
# Rules: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
default: true

# Line length: we write one paragraph per line, so this rule does not apply.
MD013: false

# Inline HTML: allowed for the README logo (<picture>) and badges.
MD033:
  allowed_elements: [picture, source, img, a, br]

# The first line need not be a heading (the README starts with the logo).
MD041: false

# Ordered lists: allow both "1." and "1)" and any numbering style.
MD029: false

# Duplicate headings are fine in different sections (for example, "Status").
MD024:
  siblings_only: true
