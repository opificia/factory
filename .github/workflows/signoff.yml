#
# Second half of sign-off by approval (ADR-0006). It runs from the default
# branch after the Sign-off request workflow, so a pull request cannot change
# it. It finds an approving review with "/signoff" by a maintainer on the
# current head, adds that maintainer's sign-off to the commits and pushes them
# as the Opificia bot. See .github/scripts/signoff.sh.
#
# Needs the repository variable OPIFICIA_BOT_APP_ID and the secret
# OPIFICIA_BOT_PRIVATE_KEY, for a GitHub App installed only on this repository
# with "Contents: read and write". See CONTRIBUTING.md.
name: Sign-off

on:
  workflow_run:
    workflows: [Sign-off request]
    types: [completed]

permissions: read-all

concurrency:
  group: signoff-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  signoff:
    name: Record a maintainer's sign-off
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the maintainers
        run: .github/scripts/maintainers.sh MAINTAINERS.md > "$RUNNER_TEMP/maintainers.tsv"
      - name: Find the approving review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MAINTAINERS_FILE: ${{ runner.temp }}/maintainers.tsv
        run: .github/scripts/signoff.sh find
      - name: Get a token for the Opificia bot
        id: token
        if: steps.review.outputs.login != ''
        env:
          APP_ID: ${{ vars.OPIFICIA_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.OPIFICIA_BOT_PRIVATE_KEY }}
        run: .github/scripts/signoff.sh token
      - name: Sign off and push
        if: steps.review.outputs.login != ''
        env:
          LOGIN: ${{ steps.review.outputs.login }}
          BRANCH: ${{ steps.review.outputs.branch }}
          BASE: ${{ steps.review.outputs.base }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MAINTAINERS_FILE: ${{ runner.temp }}/maintainers.tsv
          PUSH_URL: https://x-access-token:${{ steps.token.outputs.token }}@github.com/${{ github.repository }}.git
        run: .github/scripts/signoff.sh apply
