# Checks that every file has copyright and licence information, following the
# REUSE specification. See REUSE.toml.
name: REUSE

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
