#
# The DCO check of pull requests (ADR-0006). The job name is the check name
# that the branch rules require; keep it stable.
#
# It runs on pull_request_target, so GitHub always takes this workflow and the
# scripts from the default branch, never from the pull request. A pull request
# cannot change the check that judges it. The job only reads the commits of
# the pull request with git and never runs code from it, has read access only
# and uses no secrets.
name: DCO

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: read-all

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fetches the commits only. Nothing from the pull request is checked
      # out or run.
      - name: Fetch the commits of the pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git cat-file -e "${HEAD_SHA}^{commit}"
      - name: Check every commit for a sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/dco-check.sh
