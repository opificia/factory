# Fails pull requests that contain commits without a Signed-off-by line.
# See the DCO section of CONTRIBUTING.md.
name: DCO

on:
  pull_request:

permissions: read-all

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit for a sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author_email="$(git show -s --format='%ae' "$sha")"
            signoffs="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if grep -qiF "<${author_email}>" <<< "$signoffs"; then
              echo "ok      $(git show -s --format='%h %s' "$sha")"
            else
              echo "missing $(git show -s --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Some commits lack a Signed-off-by line matching the commit author's email."
            echo "See CONTRIBUTING.md, section 'How to fix a missing sign-off'."
            exit 1
          fi
