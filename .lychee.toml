# lychee link checker configuration. See https://lychee.cli.rs.

# Retry flaky hosts before failing, but not for long: one slow host sets the
# time of the whole check.
max_retries = 2
retry_wait_time = 3
timeout = 20

# Accept rate limiting as "not broken".
accept = ["200..=299", "429"]

# Links that cannot be checked from CI.
exclude = [
  # The brand book is private for now and needs a login.
  "^https://claude\\.ai/",
  # Badge endpoints that only work once the repository is public and registered.
  "^https://api\\.reuse\\.software/",
  "^https://api\\.scorecard\\.dev/",
  "^https://scorecard\\.dev/viewer/",
  # The repository is private for now, so its own pages return 404 to the
  # checker. Remove this line once the repository is public.
  "^https://github\\.com/opificia/factory",
  # Email addresses.
  "^mailto:",
]

# Never check local addresses such as localhost.
exclude_loopback = true

# Do not check links inside code blocks.
include_verbatim = false
